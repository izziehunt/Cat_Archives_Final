<!DOCTYPE html>
<html lang="en">
    <head>
        <style>body { background-color: rgb(251, 247, 241)</style>
<div class="center-container">
    <style>

        @font-face {
            font-family:'Wingman';
            src:url('styles/fonts/TAYWingman.woff')
        }
        {
            font-family:Wingman;
        }
img {
  padding: 5px;
  width: 150px;
}
* {
  box-sizing: border-box;
}

.hover-rotate {
  display: inline-block;
  transition: transform 0.2s ease;
}

.hover-rotate:hover {
  transform: rotate(7deg);
}

.shelf-wrapper {
  position: absolute;
  left: -40%;
  bottom: 70%;
  width: 40%;
}

.shelf-items {
  display: flex;
  justify-content: flex-start;
  align-items: flex-end;
  gap: 4px;
  margin-bottom: 1px;
}

.shelf-img {
  display: block;
  width: 110%;
  height: auto;
  margin-bottom: 0;
  padding: 0;
}

.plant-hover-wrap,
.radio-hover-wrap {
  display: block;
  position: relative;
  width: 60%;
  transition: transform 0.2s ease;
}

.plant-hover-wrap:hover,
.radio-hover-wrap:hover {
  transform: rotate(5deg);
}

.plant-hover-wrap img,
.radio-hover-wrap img {
  padding: 0;
  display: block;
  vertical-align: top;
}

.plant-hover-wrap .plant-default,
.radio-hover-wrap .radio-default {
  width: 100%;
  height: auto;
}

.plant-hover-wrap .plant-hover,
.radio-hover-wrap .radio-hover {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: top left;
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}

.plant-hover-wrap:hover .plant-hover,
.radio-hover-wrap:hover .radio-hover {
  opacity: 1;
}

.food-bag-hover-wrap {
  display: block;
  position: relative;
  width: 24%;
  flex-shrink: 0;
  transition: transform 0.2s ease;
}

.food-bag-hover-wrap:hover {
  transform: rotate(5deg);
}

.food-bag-hover-wrap img {
  padding: 0;
  display: block;
  vertical-align: top;
}

.food-bag-hover-wrap .food-bag-default {
  width: 100%;
  height: auto;
}

.food-bag-hover-wrap .food-bag-hover {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: top left;
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}

.food-bag-hover-wrap:hover .food-bag-hover {
  opacity: 1;
}

.catbed-hover-wrap {
  display: block;
  position: relative;
  width: 50%;
  flex-shrink: 0;
  transition: transform 0.2s ease;
}

.catbed-hover-wrap:hover {
  transform: rotate(5deg);
}

.catbed-hover-wrap img {
  padding: 0;
  display: block;
  vertical-align: top;
}

.catbed-hover-wrap .catbed-default {
  width: 100%;
  height: auto;
}

.catbed-hover-wrap .catbed-hover {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: top left;
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}

.catbed-hover-wrap:hover .catbed-hover {
  opacity: 1;
}

.alfie-column-content {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  margin-top: 55%;
}

.alfie-link {
  width: 24%;
  flex-shrink: 0;
}

.alfie-link img {
  width: 100%;
}

.macii-column-content {
  width: 100%;
  display: flex;
  justify-content: flex-end;
  align-items: flex-end;
  gap: 10px;
  margin-top: 55%;
  padding-right: 5%;
}

.macii-link {
  width: 35%;
  flex-shrink: 0;
}

.macii-link img {
  width: 100%;
}

.row {
  display: flex;
}

/* Create three equal columns that sits next to each other */
.column {
  flex: 33.33%;
  padding: 5px;
}

.tree-column {
  position: relative;
}

    </style>
</div>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>cat.archives</title>
          
            <link rel="stylesheet" href="styles/style.css">
          </head>
    </head>
    <body>
        
        <div class="center-container">
            <h1 style="font-family:'Wingman';text-align:center;font-size:50px">CAT ARCHIVES</h1>
            <h2 style="font-family:'Wingman';text-align:center">Have You Ever Wondered...</h2>
            <p style="font-family:'Wingman';text-align:center">What's Popular Amongst Cats Right Now?
            <br></br>
           *Click Around!*
            </p>
            
       </div>
       
  </div>
      <div class="row">
        <div class="column">
          <div class="macii-column-content">
            <a href="index6.html" class="food-bag-hover-wrap">
              <img src="styles/images/food_bag_BW.png" class="food-bag-default" alt="Food Bag">
              <img src="styles/images/food_bag.png" class="food-bag-hover" alt="">
            </a>
            <a href="index2.html" class="macii-link">
              <img src="styles/images/macii.png" class="hover-rotate" alt="Macii">
            </a>
          </div>
        </div>
        <div class="column tree-column">
          <div class="shelf-wrapper">
            <div class="shelf-items">
              <a href="index4.html" class="plant-hover-wrap">
                <img src="styles/images/plant.png" class="plant-default" alt="Plant">
                <img src="styles/images/plant_color.png" class="plant-hover" alt="">
              </a>
              <div class="radio-hover-wrap">
                <a href="index5.html" class="radio-link">
                <img src="styles/images/cat_radio.png" class="radio-default" alt="Cat Radio">
                <img src="styles/images/cat_radio_color.png" class="radio-hover" alt="">
                </a>
              </div>
            </div>
            <img src="styles/images/shelf.png" class="shelf-img" alt="Shelf">
          </div>
          <img src="styles/images/cat_tree_doodle.png" style="width:100%;">
        </div>
        <div class="column">
          <div class="alfie-column-content">
            <a href="index3.html" class="alfie-link">
              <img src="styles/images/alfie.png" class="hover-rotate" alt="Alfie">
            </a>
            <div class="catbed-hover-wrap">
              <img src="styles/images/catbed.png" class="catbed-default" alt="Cat Bed">
              <img src="styles/images/catbed_color.png" class="catbed-hover" alt="">
            </div>
          </div>
        </div>

        <script>
          (function () {
            var maciiImg = document.querySelector('img[src*="macii.png"]');
            var alfieImg = document.querySelector('img[src*="alfie.png"]');

            if (maciiImg) {
              var maciiDefault = 'styles/images/macii.png';
              var maciiColor = 'styles/images/macii_color.png';
              maciiImg.addEventListener('mouseenter', function () {
                maciiImg.src = maciiColor;
              });
              maciiImg.addEventListener('mouseleave', function () {
                maciiImg.src = maciiDefault;
              });
            }

            if (alfieImg) {
              var alfieDefault = 'styles/images/alfie.png';
              var alfieColor = 'styles/images/alfie_color.png';
              alfieImg.addEventListener('mouseenter', function () {
                alfieImg.src = alfieColor;
              });
              alfieImg.addEventListener('mouseleave', function () {
                alfieImg.src = alfieDefault;
              });
            }

            var maciiLink = document.querySelector('.macii-link');
            var alfieLink = document.querySelector('.alfie-link');
            var plantWrap = document.querySelector('.plant-hover-wrap');
            var radioLink = document.querySelector('.radio-link');

            var alfieMeow = new Audio('styles/audio/meow.mp3');
            var maciiMeow = new Audio('styles/audio/meow2.mp3');
            var leavesRustle = new Audio('styles/audio/leaves.mp3');
            var radioSong = new Audio('styles/audio/cat_song.mp3');

            function playSound(audio) {
              audio.currentTime = 0;
              audio.play().catch(function () {});
            }

            if (maciiLink) {
              maciiLink.addEventListener('mouseenter', function () {
                playSound(maciiMeow);
              });
            }

            if (alfieLink) {
              alfieLink.addEventListener('mouseenter', function () {
                playSound(alfieMeow);
              });
            }

            if (plantWrap) {
              plantWrap.addEventListener('mouseenter', function () {
                playSound(leavesRustle);
              });
            }
            if (radioLink) {
              radioLink.addEventListener('mouseenter', function () {
                playSound(radioSong);
              });
            }
          })();
        </script>

    </body>
</html>
