<!DOCTYPE html>
<html lang="en">
    <head>
        <style>body { background-color: rgb(251, 247, 241)</style>
<div class="center-container">
    <style>

        @font-face {
            font-family:'Wingman';
            src:url('styles/fonts/TAYWingman.woff')
        }
        {
            font-family:Wingman;
        }
img {
  padding: 5px;
  width: 150px;
}
* {
  box-sizing: border-box;
}

.hover-rotate {
  display: inline-block;
  transition: transform 0.2s ease;
}

.hover-rotate:hover {
  transform: rotate(7deg);
}

.shelf-wrapper {
  position: absolute;
  left: -40%;
  bottom: 70%;
  width: 40%;
}

.shelf-items {
  display: flex;
  justify-content: flex-start;
  align-items: flex-end;
  gap: 6px;
  margin-bottom: 6px;
}

.shelf-img {
  display: block;
  width: 110%;
  height: auto;
  margin-bottom: 0;
  padding: 0;
}

.plant-hover-wrap,
.radio-hover-wrap {
  display: block;
  position: relative;
  width: 60%;
  transition: transform 0.2s ease;
}

.plant-hover-wrap:hover,
.radio-hover-wrap:hover {
  transform: rotate(5deg);
}

.plant-hover-wrap img,
.radio-hover-wrap img {
  padding: 0;
  display: block;
  vertical-align: top;
}

.plant-hover-wrap .plant-default,
.radio-hover-wrap .radio-default {
  width: 100%;
  height: auto;
}

.plant-hover-wrap .plant-hover,
.radio-hover-wrap .radio-hover {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: top left;
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}

.plant-hover-wrap:hover .plant-hover,
.radio-hover-wrap:hover .radio-hover {
  opacity: 1;
}

.window-hover-wrap {
  position: absolute;
  top: -20%;
  left: 40%;
  transform: translateX(-50%);
  width: 45%;
  pointer-events: auto;
  transition: transform 0.2s ease;
  z-index: 1;
}

.window-hover-wrap img {
  padding: 0;
  display: block;
  vertical-align: top;
  width: 100%;
  height: auto;
  object-fit: contain;
}

.window-hover-wrap .window-default {
  width: 100%;
  height: auto;
}

.window-hover-wrap .window-hover {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: top left;
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}

.window-hover-wrap:hover .window-hover {
  opacity: 1;
}

.food-bag-hover-wrap {
  position: absolute;
  bottom: 15%;
  right: 45%;
  width: 18%;
  display: block;
  pointer-events: auto;
  transition: transform 0.2s ease;
}

.food-bag-hover-wrap img {
  padding: 0;
  display: block;
  vertical-align: top;
  width: 100%;
  height: auto;
  object-fit: contain;
}

.food-bag-hover-wrap .food-bag-default {
  width: 100%;
  height: auto;
}

.food-bag-hover-wrap .food-bag-hover {

  width: 100%;

  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}

.food-bag-hover-wrap:hover .food-bag-hover {
  opacity: 1;
}

.food-and-brush-group {
  position: absolute;
  bottom: 15%;
  left: 20%;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  pointer-events: auto;
  width: 55%;
}

.food-bag-by-macii {
  position: absolute;
  top: 52%;
  left: 48%;
  width: 22%;
  display: block;
  transition: transform 0.2s ease;
  pointer-events: auto;
  z-index: 2;
}

.food-bag-by-macii img {
  padding: 0;

  width: 100%;
  height: auto;

}

.food-bag-by-macii .food-bag-default {
  width: 100%;

}

.food-bag-by-macii .food-bag-hover {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: top left;
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}

.food-bag-by-macii:hover .food-bag-hover {
  opacity: 1;
}

.catbrush-hover-wrap {
  position: relative;
  display: block;
  width: 35%;
  flex-shrink: 0;
  transition: transform 0.2s ease;
}

.catbrush-hover-wrap:hover {
  transform: rotate(7deg);
}

.catbrush-hover-wrap img {

.catbrush-hover-wrap .catbrush-default {

.catbrush-hover-wrap .catbrush-hover {

.bed-hover-wrap {

.bed-hover-wrap img {
  padding: 0;

  vertical-align: top;

  height: auto;

}

.bed-hover-wrap .bed-default {
  width: 100%;

}

.bed-hover-wrap .bed-hover {

            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>cat.archives</title>
          
            <link rel="stylesheet" href="styles/style.css">
          </head>
    </head>
    <body>
        
        <div class="center-container">
            <h1 style="font-family:'Wingman';text-align:center;font-size:50px; padding: 50px;">CAT ARCHIVES</h1>
            
       </div>
       
  </div>
      <div class="row">
        <div class="column" style="position:relative">
          <div class="food-and-brush-group">
            <a href="index9.html" class="catbrush-hover-wrap">
              <img src="styles/images/catbrush.png" class="catbrush-default" alt="Cat Brush">
              <img src="styles/images/catbrush_color.png" class="catbrush-hover" alt="">
            </a>
          </div>
          <a href="index6.html" class="food-bag-by-macii hover-rotate">
            <img src="styles/images/food_bag_BW.png" class="food-bag-default" alt="Cat Food">
            <img src="styles/images/food_bag.png" class="food-bag-hover" alt="">
          </a>
          <a href="index2.html" class="macii-link">
            <img src="styles/images/macii.png" class="hover-rotate" style="width:35%;margin-top:48%;margin-left:72%">
          </a>
        </div>
        <div class="column tree-column">
          <div class="shelf-wrapper">
            <div class="shelf-items">
              <a href="index4.html" class="plant-hover-wrap">
                <img src="styles/images/plant.png" class="plant-default" alt="Plant">
                <img src="styles/images/plant_color.png" class="plant-hover" alt="">
              </a>
              <div class="radio-hover-wrap">
                <a href="index5.html" class="radio-link">
                <img src="styles/images/cat_radio.png" class="radio-default" alt="Cat Radio">
                <img src="styles/images/cat_radio_color.png" class="radio-hover" alt="">
                </a>
              </div>
            </div>
            <img src="styles/images/shelf.png" class="shelf-img" alt="Shelf">
          </div>
          <img src="styles/images/cat_tree_doodle.png" style="width:100%;">
        </div>
        <div class="column" style="position:relative">
            <a href="index8.html" class="window-hover-wrap">
              <img src="styles/images/window.png" class="window-default" alt="Window">
              <img src="styles/images/window_color.png" class="window-hover" alt="">
            </a>
            <a href="index3.html" class="alfie-link">
              <img src="styles/images/alfie.png" class="hover-rotate" style="width:24%;margin-top:55%">
            </a>
            <div class="bed-hover-wrap">
                <a href="index7.html" class="bed-hover-wrap">
              <img src="styles/images/catbed.png" class="bed-default" alt="Cat Bed">
              <img src="styles/images/catbed_color.png" class="bed-hover" alt="">
            </div>
        </div>

        <script>
          (function () {
            var maciiImg = document.querySelector('img[src*="macii.png"]');
            var alfieImg = document.querySelector('img[src*="alfie.png"]');

            if (maciiImg) {
              var maciiDefault = 'styles/images/macii.png';
              var maciiColor = 'styles/images/macii_color.png';
              maciiImg.addEventListener('mouseenter', function () {
                maciiImg.src = maciiColor;
              });
              maciiImg.addEventListener('mouseleave', function () {
                maciiImg.src = maciiDefault;
              });
            }

            if (alfieImg) {
              var alfieDefault = 'styles/images/alfie.png';
              var alfieColor = 'styles/images/alfie_color.png';
              alfieImg.addEventListener('mouseenter', function () {
                alfieImg.src = alfieColor;
              });
              alfieImg.addEventListener('mouseleave', function () {
                alfieImg.src = alfieDefault;
              });
            }

            var maciiLink = document.querySelector('.macii-link');
            var alfieLink = document.querySelector('.alfie-link');
            var plantWrap = document.querySelector('.plant-hover-wrap');
            var radioLink = document.querySelector('.radio-link');

            var alfieMeow = new Audio('styles/audio/meow.mp3');
            var maciiMeow = new Audio('styles/audio/meow2.mp3');
            var leavesRustle = new Audio('styles/audio/leaves.mp3');
            var radioSong = new Audio('styles/audio/cat_song.mp3');

            function playSound(audio) {
              audio.currentTime = 0;
              audio.play().catch(function () {});
            }

            if (maciiLink) {
              maciiLink.addEventListener('mouseenter', function () {
                playSound(maciiMeow);
              });
            }

            if (alfieLink) {
              alfieLink.addEventListener('mouseenter', function () {
                playSound(alfieMeow);
              });
            }

            if (plantWrap) {
              plantWrap.addEventListener('mouseenter', function () {
                playSound(leavesRustle);
              });
            }
            if (radioLink) {
              radioLink.addEventListener('mouseenter', function () {
                playSound(radioSong);
              });
            }
          })();
        </script>

    </body>
</html>
