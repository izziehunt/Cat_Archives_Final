<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>cat.archives</title>
        <style>
            @font-face {
                font-family: 'Wingman';
                src: url('styles/fonts/TAYWingman.woff');
            }
            body {
                margin: 0;
                background-color: rgb(251, 247, 241);
                font-family: 'Wingman', sans-serif;
                text-align: center;
                padding-top: 40px;
            }
            h1 {
                font-family: 'Wingman';
                font-size: 50px;
                margin: 0 0 10px;
            }
            .cat-grid {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 32px;
                max-width: 1400px;
                margin: 0 auto;
                padding: 100px;
            }
            .cat-row {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 28px;
                flex-wrap: wrap;
            }
            .cat-row img {
                width: 200px;
                height: 200px;
                object-fit: contain;
                display: inline-block;
                transition: transform 0.2s ease;
                cursor: pointer;
            }
            .cat-row img:hover {
                transform: rotate(5deg);
            }
        </style>
    </head>
    <body>
        <h1>CAT SOUNDBOARD</h1>

        <div class="cat-grid">
            <div class="cat-row">
                <img src="styles/images/cat1.png" alt="Cat 1" data-cat="1">
                <img src="styles/images/cat2.png" alt="Cat 2" data-cat="2">
                <img src="styles/images/cat3.png" alt="Cat 3" data-cat="3">
                <img src="styles/images/cat4.png" alt="Cat 4" data-cat="4">
                <img src="styles/images/cat5.png" alt="Cat 5" data-cat="5">
                <img src="styles/images/cat6.png" alt="Cat 6" data-cat="6">
            </div>
            <div class="cat-row">
                <img src="styles/images/cat7.png" alt="Cat 7" data-cat="7" data-sound="10">
                <img src="styles/images/cat8.png" alt="Cat 8" data-cat="8">
                <img src="styles/images/cat9.png" alt="Cat 9" data-cat="9">
                <img src="styles/images/cat10.png" alt="Cat 10" data-cat="10" data-sound="7">
                <img src="styles/images/cat11.png" alt="Cat 11" data-cat="11">
            </div>
        </div>

        <script>
            (function () {
                var imgs = document.querySelectorAll('.cat-grid img[data-cat]');
                for (var i = 0; i < imgs.length; i++) {
                    var img = imgs[i];
                    var n = img.getAttribute('data-sound') || img.getAttribute('data-cat');
                    if (n) {
                        var audio = new Audio('styles/audio/cat' + n + '_sound.mp3');
                        img.addEventListener('click', (function (a) {
                            return function () {
                                a.currentTime = 0;
                                a.play().catch(function () {});
                            };
                        })(audio));
                    }
                }
            })();
        </script>
    </body>
</html>
