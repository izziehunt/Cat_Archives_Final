<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>cat.archives - Cat Food</title>
        <style>
            @font-face {
                font-family: 'Wingman';
                src: url('styles/fonts/TAYWingman.woff');
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                background-color: rgb(251, 247, 241);
                font-family: 'Wingman', sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 40px 20px;
            }
            h1 {
                font-family: 'Wingman';
                font-size: 50px;
                margin: 0 0 30px;
            }
            h3.carousel-label {
                font-family: 'Wingman';
                font-size: 28px;
                margin: 0 0 12px;
            }
            .carousel-wrapper {
                position: relative;
                width: 100%;
                overflow: hidden;
                margin-bottom: 40px;
            }
            .carousel-wrapper:last-child {
                margin-bottom: 0;
            }
            .carousel-track {
                display: flex;
                gap: 24px;
                width: max-content;
                animation: scroll 30s linear infinite;
            }
            .carousel-track:hover {
                animation-play-state: paused;
            }
            .carousel-slide {
                flex-shrink: 0;
                width: 160px;
                height: 160px;
                display: flex;
                justify-content: center;
                align-items: center;
                background: transparent;
            }
            .carousel-slide img {
                width: 160px;
                height: 160px;
                object-fit: contain;
            }
            @keyframes scroll {
                0% { transform: translateX(0); }
                100% { transform: translateX(-50%); }
            }
        </style>
    </head>
    <body>
        <h1>CAT ARCHIVES

        <h3 class="carousel-label">Good Food</h3>
        <div class="carousel-wrapper">
            <div class="carousel-track" id="carouselTrack">
                <div class="carousel-slide"><img src="styles/images/cat_food1.png" alt="Cat Food 1"></div>
                <div class="carousel-slide"><img src="styles/images/cat_food2.png" alt="Cat Food 2"></div>
                <div class="carousel-slide"><img src="styles/images/cat_food3.png" alt="Cat Food 3"></div>
                <div class="carousel-slide"><img src="styles/images/cat_food4.png" alt="Cat Food 4"></div>

                <div class="carousel-slide"><img src="styles/images/cat_food6.png" alt="Cat Food 6"></div>
                <div class="carousel-slide"><img src="styles/images/cat_food7.png" alt="Cat Food 7"></div>
                <div class="carousel-slide"><img src="styles/images/cat_food8.png" alt="Cat Food 8"></div>
                <!-- Duplicate set for seamless loop -->
                <div class="carousel-slide"><img src="styles/images/cat_food1.png" alt="Cat Food 1"></div>
                <div class="carousel-slide"><img src="styles/images/cat_food2.png" alt="Cat Food 2"></div>
                <div class="carousel-slide"><img src="styles/images/cat_food3.png" alt="Cat Food 3"></div>
                <div class="carousel-slide"><img src="styles/images/cat_food4.png" alt="Cat Food 4"></div>

                <div class="carousel-slide"><img src="styles/images/cat_food6.png" alt="Cat Food 6"></div>
                <div class="carousel-slide"><img src="styles/images/cat_food7.png" alt="Cat Food 7"></div>
                <div class="carousel-slide"><img src="styles/images/cat_food8.png" alt="Cat Food 8"></div>
            </div>
        </div>

        <h3 class="carousel-label">Bad Food</h3>

</html>
